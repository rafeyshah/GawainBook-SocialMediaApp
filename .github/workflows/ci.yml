name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (type-check, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Node-Rest-API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Node-Rest-API/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Tests start a throwaway PostgreSQL (embedded-postgres); no secrets needed.
      - run: npm test

  frontend:
    name: Frontend (tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # react-scripts 4 only runs on Node 16.
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx react-scripts test --watchAll=false
      - run: npx react-scripts build

  e2e:
    name: End-to-end (Playwright, core circle journey)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: react-frontend
      - run: npx react-scripts build
        working-directory: react-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Node-Rest-API/package-lock.json
            e2e/package-lock.json
      - run: npm ci && npm run build
        working-directory: Node-Rest-API
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      # Starts a throwaway GawainBook (temporary Postgres + demo books) and
      # runs the journey against it. No secrets needed.
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
