<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">GawainBook</title>
  <desc id="desc">GawainBook — a social network for book lovers</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#eef1ec"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#e6e6e3"/>

  <!-- Logo mark: open book on a green tile -->
  <g transform="translate(96 104)">
    <rect width="112" height="112" rx="26" fill="#2f7553"/>
    <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M56 38 C46 31 34 29 22 30 V80 C34 79 46 81 56 88 C66 81 78 79 90 80 V30 C78 29 66 31 56 38 Z"/>
      <path d="M56 38 V88"/>
      <path d="M66 50 C72 47 77 46 82 46 M66 62 C72 59 77 58 82 58" stroke-width="4"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="240" y="168" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#18181b">GawainBook</text>
    <text x="242" y="212" font-size="26" font-weight="400" fill="#6b6b73">A social network for book lovers</text>
  </g>

  <!-- Bookshelf accent -->
  <g transform="translate(900 92)">
    <rect x="0"   y="46" width="30" height="112" rx="4" fill="#2f7553"/>
    <rect x="36"  y="24" width="36" height="134" rx="4" fill="#4ca67a"/>
    <rect x="78"  y="58" width="26" height="100" rx="4" fill="#c8693f"/>
    <rect x="110" y="34" width="34" height="124" rx="4" fill="#e3b05c"/>
    <rect x="150" y="62" width="28" height="96"  rx="4" fill="#2f7553" opacity="0.55"/>
    <rect x="186" y="16" width="30" height="142" rx="4" fill="#18181b" opacity="0.85" transform="rotate(8 201 158)"/>
    <g fill="#ffffff" opacity="0.45">
      <rect x="6"   y="60" width="18" height="3" rx="1.5"/>
      <rect x="42"  y="40" width="24" height="3" rx="1.5"/>
      <rect x="84"  y="72" width="14" height="3" rx="1.5"/>
      <rect x="116" y="48" width="22" height="3" rx="1.5"/>
    </g>
    <rect x="-12" y="158" width="250" height="6" rx="3" fill="#b4b4b8"/>
  </g>
