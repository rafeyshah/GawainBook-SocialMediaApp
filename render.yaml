services:
  - type: web
    name: gawainbook
    runtime: node
    plan: free
    branch: master
    autoDeployTrigger: commit
    # The frontend builds with Node 16 (react-scripts 4) via npx; the server
    # runs on Node 22. Migrations run automatically when the server starts.
    buildCommand: npm ci && npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon Postgres (from `neon env pull` / the Neon console).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Neon object storage (bucket "assets").
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-2
