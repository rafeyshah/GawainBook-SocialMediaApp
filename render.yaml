services:
  - type: web
    name: gawainbook
    runtime: node
    plan: free
    branch: master
    autoDeployTrigger: commit
    # The frontend builds with Node 16 (react-scripts 4) via npx; the server
    # runs on Node 22. Migrations run automatically when the server starts.
    buildCommand: npm ci && npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon Postgres (from `neon env pull` / the Neon console).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Neon object storage (bucket "assets").
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-2
      # Waitlist + Impressum (German law requires a real name, postal address
      # and email before collecting sign-ups). The waitlist stays closed until
      # all three are set AND WAITLIST_OPEN is "true".
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ADDRESS # lines separated by "|", e.g. Street 1|12345 Berlin|Germany
        sync: false
      - key: LEGAL_EMAIL
        sync: false
      - key: WAITLIST_OPEN
        value: "false"
